x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gamebot}
      MYSQL_USER: ${DB_USER:-gamebot}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DB_PATH:-./data/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations  # mount the migrations folder
    command:
      - "-path=/migrations"
      - "-database=mysql://${DB_USER}:${DB_PASSWORD}@tcp(mysql:3306)/${DB_NAME}"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  bot:
    build:
      context: .
      dockerfile: cmd/bot/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      # Persistent media file_id cache (survives container rebuilds).
      - ./data:/app/data
    restart: unless-stopped
    logging: *default-logging

  notifier:
    build:
      context: .
      dockerfile: cmd/notifier/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    restart: unless-stopped
    logging: *default-logging

  scheduler:
    build:
      context: .
      dockerfile: cmd/scheduler/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      # Persistent media file_id cache (survives container rebuilds).
      - ./data:/app/data
    restart: unless-stopped
    logging: *default-logging
